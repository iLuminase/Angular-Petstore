spring:
  application:
    name: api-product

  datasource:
    url: jdbc:mysql://localhost:3306/petstore_store?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
